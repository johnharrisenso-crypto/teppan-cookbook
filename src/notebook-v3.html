<style>
/* Version 3 (CS-066, 2026-11-05): Shop sends unchecked items to the shared Grocery list sheet; Cook # suggests max cook number + 1 (ISS-071). */
/* Version 2 (CS-063, 2026-11-01): amounts shown under each step, scaled; totals in the ingredient's own unit. */
/* Layout: one column, phone first; a bottom tab bar like a counter's order slips (Recipes, Shop, Log, Learn). */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --sunk:#E3E7E1; --ink:#1D2330; --muted:#5F6876; --line:#D2D8D0;

  --display:"Zen Maru Gothic","Zen Kaku Gothic New","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --body:"IBM Plex Sans","Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --r:14px; --r-s:9px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12161D; --surface:#1B212B; --sunk:#232A35; --ink:#E7EAEE; --muted:#9AA3AF; --line:#2E3643;
  --nori:#7CC489; --nori-soft:#21362A; --beni:#F0778A; --beni-soft:#3B2228; --sauce:#D6A57D; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1B212B; --sunk:#232A35; --ink:#E7EAEE; --muted:#9AA3AF; --line:#2E3643;
  --nori:#7CC489; --nori-soft:#21362A; --beni:#F0778A; --beni-soft:#3B2228; --sauce:#D6A57D; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--nori);outline-offset:2px}
.jp{font-family:var(--jp)}
.wrap{max-width:620px;margin:0 auto;padding-top:12px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:700;letter-spacing:.01em}
h2{font-size:20px;font-weight:700}
h3{font-size:13px;font-weight:600;font-family:var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0 14px}

.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}

.rcard{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:var(--r);padding:18px 16px}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}

.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}

details.sec>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px;cursor:pointer}

.ing{border-top:1px solid var(--line)}

.more p{margin:0 0 6px}.more p:last-child{margin:0}

ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}

.st{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}

.st-ings li:first-child{border-top:0}
.st-ings .nm{color:var(--muted)}
.st-ings .amt{text-align:right;white-space:normal;flex:0 1 auto}
.st-ings .nm{flex:1 0 auto}
ul.plain{margin:0;padding-left:18px}
/* shop */
.sh-sec{margin-bottom:12px}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:start;border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:0}
.item input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--nori)}
.item.got .iname{color:var(--muted);text-decoration:line-through}
.iname{font-weight:500}
.where{font-size:13px;color:var(--muted)}
.rq{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rq:first-child{border-top:0}
/* log */
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
textarea,input[type=text],input[type=date],select{width:100%;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg);padding:10px 12px}
textarea{min-height:64px;resize:vertical}
.btn{border:0;border-radius:var(--r-s);padding:12px 16px;font-weight:600;background:var(--nori);color:var(--surface)}
.btn.wide{width:100%;padding:14px;font-size:17px}
.btn[disabled]{opacity:.55}
.scores{display:flex;gap:8px}
.scores button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:10px 0;font-weight:600}
.scores button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cook{border-top:1px solid var(--line);padding:12px 0}
.cook:first-child{border-top:0}
.cook dl{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;margin:6px 0 0;font-size:14px}
.cook dt{color:var(--muted)}
.cook dd{margin:0}
/* learn */
.gl{border-top:1px solid var(--line);padding:10px 0}
.gl:first-child{border-top:0}
.gl b{font-family:var(--display)}
table.conv{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:620px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;padding:6px 0;border-radius:10px}
nav.tabs a .k{font-family:var(--jp);font-size:17px;font-weight:500;line-height:1.1}
nav.tabs a[aria-current="page"]{color:var(--nori);background:var(--nori-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-weight:500;max-width:92vw;z-index:10}
.empty{padding:24px 4px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .16s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<script>
const SHEET_ID = "1PQas1S5aXxoIXJlkSt1e-9BhjS0KEXLjEPqoL6T9ZZo";
const SERVER = "Google Sheets";
const GROCERY_ID = "1KxlIa3BW6oNmaBci59vc5kcs3fVxswmQpJEHcLd1OZo"; // COK-003 Grocery list, List!A:L (shared with Courtney)
const GROCERY_HEAD = ["ID","Item","Qty","Section","Store","Note","Added by","Added","Done","Done by","Done at","Cleared"];
const TABS = {
  Recipes:     {range:"Recipes!A1:M200",     head:["ID","Name","Japanese","Version","Unit","Unit plural","Default servings","Style","Why it works","Source","Equipment","What changed in this version","Status"]},
  Ingredients: {range:"Ingredients!A1:K1000", head:["Recipe","Order","Group","Item","Look for","Per serving","Unit","Prep","Pantry ID","Why (detail)","Note"]},
  Steps:       {range:"Steps!A1:H1000",       head:["Recipe","Phase","Order","Step","Detail","Timer (min)","Glossary","Ingredients"]},
  Pantry:      {range:"Pantry!A1:L500",       head:["#","Item","Look for (Japanese)",null,"Where in Nijiya",null,"Notes","Recipes","Pantry ID","Section","Buy by","Keep"]},
  Glossary:    {range:"Glossary!A1:D500",     head:["Term","Japanese","Kind","Meaning"]},
  Cooks:       {range:"Cooks!A1:I5000",       head:["Date","Recipe","Cook #",null,null,"Her reaction",null,"Next time try","Recipe ID"]}
};
const SECTION_ORDER = ["Produce","Meat","Refrigerated and pickles","Dry goods","Sauces and seasonings","Home staples"];
const PER_BOWL = new Set(["Fillings","On top while cooking","Finish","Griddle"]);
const CABBAGE_HEAD_G = 900; // owner, cook 1: 300 g is about 1/3 of a head

let mcp = null, D = null, syncedAt = null, saving = false;
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("teppan:"+k); return v==null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("teppan:"+k, JSON.stringify(v)); }catch{} }
};

/* ---------- amounts ---------- */
const FR = [[0,""],[0.125,"⅛"],[0.25,"¼"],[1/3,"⅓"],[0.5,"½"],[2/3,"⅔"],[0.75,"¾"],[1,""]];
function frac(x){
  let w = Math.floor(x), r = x - w, best = FR[0], bd = 9;
  for(const f of FR){ const d = Math.abs(r - f[0]); if(d < bd){ bd = d; best = f; } }
  if(best[0] === 1){ w += 1; best = FR[0]; }
  const approx = w + best[0];
  const txt = (w ? String(w) : "") + (best[1] ? (w ? " " : "") + best[1] : "");
  return {txt: txt || "0", approx};
}
function roundTo(x, step){ return Math.round(x / step) * step; }
function headTxt(grams){
  const x = grams / CABBAGE_HEAD_G, opts = [[1/6,"⅙"],[0.25,"¼"],[1/3,"⅓"],[0.5,"½"],[2/3,"⅔"],[0.75,"¾"],[5/6,"⅚"],[1,"1"]];
  const w = Math.floor(x), r = x - w; let best = ["", ""], bd = 9;
  for(const o of [[0,""], ...opts]){ const d = Math.abs(r - o[0]); if(d < bd){ bd = d; best = o; } }
  if(best[1] === "1") return String(w + 1);
  return (w ? w + (best[1] ? " " : "") : "") + best[1] || "0";
}
/* Steps column H: Order numbers of the ingredients a step uses; "total:" prefix shows totals only for that step */
function parseIngs(str){
  let s = String(str || "").trim(), total = false;
  if(/^total:/i.test(s)){ total = true; s = s.replace(/^total:/i, ""); }
  return {total, orders: s.split(",").map(t => parseInt(t.trim(), 10)).filter(Number.isFinite)};
}
function stepAmt(x, n, us, forceTotal, unitName){
  const scant = /scant/i.test(x.note);
  const tot = fmtAmount(x.per == null ? null : x.per * n, x.unit, scant);
  const one = fmtAmount(x.per, x.unit, scant);
  const each = PER_BOWL.has(x.group) && !forceTotal;
  const main = x.per == null ? tot.main : (each && n > 1 ? `${one.main} per ${unitName}` : tot.main);
  const sub = [];
  if(each && n > 1 && x.per != null) sub.push(`${tot.main} total`);
  if(x.pantry === "P16" && x.per != null) sub.push(`about ${headTxt(x.per * n)} head`);
  if(us && tot.us && x.per != null) sub.push(tot.us);
  return {main, sub: sub.join(" · ")};
}
function fmtAmount(qty, unit, scantFlag){
  if(qty == null || isNaN(qty) || unit === "") return {main:"to taste", us:""};
  let main, us = "";
  if(unit === "g"){
    const v = qty >= 50 ? roundTo(qty, 5) : Math.round(qty);
    main = v + " g";
    const oz = qty / 28.35; us = oz >= 16 ? (qty/453.6).toFixed(2).replace(/0$/,"") + " lb" : (oz < 1 ? oz.toFixed(2) : oz.toFixed(1)) + " oz";
  } else if(unit === "ml"){
    const v = qty >= 50 ? roundTo(qty, 5) : Math.round(qty);
    main = v + " ml";
    const c = frac(qty / 240); us = (c.txt === "0" ? (qty/29.57).toFixed(1) + " fl oz" : c.txt + " cup");
  } else if(unit === "tsp"){
    const f = frac(qty); main = f.txt + " tsp"; us = Math.round(qty * 5 * 10) / 10 + " ml";
  } else if(unit === "Tbsp"){
    const f = frac(qty); main = f.txt + " Tbsp"; us = Math.round(qty * 15) + " ml";
  } else if(unit === "egg"){
    const f = frac(qty); main = f.txt + (qty === 1 ? " egg" : " eggs");
  } else if(unit === "leaf"){
    const f = frac(qty); main = f.txt + (qty === 1 ? " leaf" : " leaves");
  } else { const f = frac(qty); main = f.txt + " " + unit; }
  if(scantFlag) main = "scant " + main;
  return {main, us};
}

/* ---------- connector ---------- */
function payloadOf(res){ let p = res && res.payload; if(typeof p === "string"){ try{ p = JSON.parse(p); }catch{} } return p; }
function errText(e){
  switch(e && e.code){
    case "needs_reauth": return "Your Google Sheets connection needs renewing. Reconnect Google Sheets in claude.ai Settings, Connectors, then tap Refresh.";
    case "server_not_connected": return "Google Sheets isn't connected. Add it in claude.ai Settings, Connectors, then tap Refresh.";
    case "selection_required": return "Choose which Google Sheets connection this page uses when Claude asks, then tap Refresh.";
    case "not_in_manifest": return "Google Sheets is turned off for this page. Allow it in the page's permissions, then tap Refresh.";
    case "blocked_by_policy": return "Your organization's settings block this page from Google Sheets.";
    case "approval_required": return "Reading your sheet needs your approval. Tap Refresh and allow Google Sheets.";
    case "not_granted": case "capability_disabled": case "capability_removed": return "This view can't reach Google Sheets. Open the page in the Claude app or on claude.ai while signed in.";
    case "tool_error": return "Google Sheets reported a problem: " + (e.message || "unknown error");
    case "server_unavailable": return "Google Sheets didn't answer in time. Tap Refresh to try again.";
    default: return (e && e.message) ? e.message : "Google Sheets couldn't be reached.";
  }
}
async function read(range){
  const call = () => mcp.callTool(SERVER, "get_values", {spreadsheetId: SHEET_ID, range}, {cache:false});
  try{ return payloadOf(await call()); }
  catch(e){
    if(e && e.retryable){ await new Promise(r => setTimeout(r, (e.retryAfterMs || 800) + Math.random()*600)); return payloadOf(await call()); }
    throw e;
  }
}

function checkHead(name, row){
  const want = TABS[name].head;
  for(let i = 0; i < want.length; i++){
    if(want[i] && String(row[i] || "").trim() !== want[i]) return `${name} column ${String.fromCharCode(65+i)} should be "${want[i]}" but reads "${row[i] || ""}".`;
  }
  return null;
}
function shape(raw){
  const rows = n => (raw[n] || []).slice(1).filter(r => r.some(c => String(c).trim() !== ""));
  const g = (r, i) => (r[i] ?? "").toString().trim();
  const recipes = rows("Recipes").map(r => ({id:g(r,0), name:g(r,1), ja:g(r,2), version:g(r,3), unit:g(r,4)||"serving", units:g(r,5)||"servings",
    def:Math.max(1, parseInt(g(r,6)) || 2), style:g(r,7), why:g(r,8), source:g(r,9), equip:g(r,10).split("\n").filter(Boolean), changed:g(r,11), status:g(r,12)})).filter(x => x.id);
  const ingredients = rows("Ingredients").map(r => ({recipe:g(r,0), order:+g(r,1)||0, group:g(r,2), item:g(r,3), look:g(r,4), per:g(r,5)===""?null:Number(g(r,5)),
    unit:g(r,6), prep:g(r,7), pantry:g(r,8), why:g(r,9), note:g(r,10)})).sort((a,b)=>a.order-b.order);
  const steps = rows("Steps").map(r => ({recipe:g(r,0), phase:g(r,1), order:+g(r,2)||0, step:g(r,3), detail:g(r,4), timer:parseFloat(g(r,5))||0, term:g(r,6), ings:g(r,7)}));
  const pantry = rows("Pantry").map(r => ({n:g(r,0), item:g(r,1), look:g(r,2), bought:g(r,3), where:g(r,4), price:g(r,5), notes:g(r,6), id:g(r,8), section:g(r,9)||"Other", buy:g(r,10)||"stock", keep:g(r,11)})).filter(x => x.id);
  const glossary = rows("Glossary").map(r => ({term:g(r,0), ja:g(r,1), kind:g(r,2)||"Other", meaning:g(r,3)}));
  const cooks = rows("Cooks").map((r,i) => ({row:i+2, date:g(r,0), recipeName:g(r,1), n:g(r,2), changed:g(r,3), happened:g(r,4), her:g(r,5), score:g(r,6), next:g(r,7), recipe:g(r,8)}));
  return {recipes, ingredients, steps, pantry, glossary, cooks};
}
async function loadAll(){
  const names = Object.keys(TABS);
  const res = await Promise.allSettled(names.map(n => read(TABS[n].range)));
  const raw = {}, problems = [];
  res.forEach((r, i) => {
    const n = names[i];
    if(r.status === "fulfilled"){
      const v = (r.value && r.value.values) || [];
      const bad = checkHead(n, v[0] || []);
      if(bad) problems.push(bad); else raw[n] = v;
    } else problems.push(errText(r.reason));
  });
  if(Object.keys(raw).length === names.length){
    D = shape(raw); syncedAt = new Date();
    store.set("cache", {raw, at: syncedAt.toISOString()});
    hideBanner();
  } else {
    const c = store.get("cache", null);
    if(c){ D = shape(c.raw); syncedAt = new Date(c.at); }
    showBanner([...new Set(problems)].join(" ") + (c ? " Showing the copy saved on this device." : ""), "Refresh", refresh);
  }
}

async function refresh(){
  if(refreshing || !mcp) return; refreshing = true;
  try{ await loadAll(); render(); } finally { refreshing = false; }
}

/* timers: per viewer, survive re-render */
const timers = {};
function fmtClock(s){ s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function startTimer(b){
  const k = b.dataset.tk;
  if(timers[k]){ clearInterval(timers[k].iv); delete timers[k]; b.className = "timer"; b.textContent = "Timer " + fmtClock(+b.dataset.timer*60); return; }
  timers[k] = {end: Date.now() + (+b.dataset.timer)*60000, iv: null};
  tick(k); timers[k].iv = setInterval(() => tick(k), 500);
}
function tick(k){
  const t = timers[k]; if(!t) return;
  const b = $app.querySelector(`[data-tk="${CSS.escape(k)}"]`);
  const left = (t.end - Date.now())/1000;
  if(left <= 0){ clearInterval(t.iv); t.done = true; if(b){ b.className = "timer end"; b.textContent = "Time's up · tap to reset"; } if(!t.beeped){ t.beeped = true; beep(); } return; }
  if(b){ b.className = "timer run"; b.textContent = fmtClock(left) + " left · tap to stop"; }
}
function restoreTimers(){ Object.keys(timers).forEach(k => { if(timers[k].done){ const b = $app.querySelector(`[data-tk="${CSS.escape(k)}"]`); if(b){ b.className="timer end"; b.textContent="Time's up · tap to reset"; } } else tick(k); }); }
function beep(){ try{ const c = new (window.AudioContext||window.webkitAudioContext)(); [0,0.35,0.7].forEach(t => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+0.2); }); }catch{} if(navigator.vibrate) try{ navigator.vibrate([200,100,200]); }catch{} }

/* Push to the shared grocery list (CS-066): one read to skip duplicates, one append, one read-back. Single-flight. */
let sending = false;
async function sendToGrocery(need, got){
  if(sending) return; sending = true; viewShop();
  const out = $app.querySelector("[data-send-result]");
  try{
    const cur = payloadOf(await mcp.callTool(SERVER, "get_values", {spreadsheetId: GROCERY_ID, range:"List!A1:L"}, {cache:false}));
    const rows = (cur && cur.values) || [];
    const head = rows[0] || [];
    for(let i = 0; i < GROCERY_HEAD.length; i++) if(String(head[i] || "").trim() !== GROCERY_HEAD[i]) throw {code:"tool_error", message:`Grocery list column ${String.fromCharCode(65+i)} should be "${GROCERY_HEAD[i]}" but reads "${head[i] || ""}". Nothing was sent.`};
    const onList = new Set(rows.slice(1).filter(r => r[0] && !(r[8]||"") && !(r[11]||"")).map(r => String(r[1]||"").trim().toLowerCase()));
    const now = new Date().toISOString();
    const items = Object.values(need).filter(e => !got[e.p.id]);
    const skipped = [], send = [];
    items.forEach((e, i) => {
      const p = e.p;
      if(onList.has(p.item.trim().toLowerCase())){ skipped.push(p.item); return; }
      const isAmt = p.buy === "amount";
      let qty = isAmt ? Object.entries(e.qty).map(([u,q]) => fmtAmount(q,u).main).join(" + ") : "";
      if(isAmt && p.id === "P16" && e.qty.g) qty += ` (about ${frac(e.qty.g / CABBAGE_HEAD_G).txt} head)`;
      const store_ = /any grocery/i.test(p.where) ? "" : "Nijiya";
      const note = [isAmt ? "" : "stock item: check what's left", p.look, p.where, "for " + [...e.recipes].join(", ")].filter(Boolean).join(" · ");
      send.push(["T" + Date.now().toString(36) + i.toString(36), p.item, qty, p.section, store_, note, "Teppan Notebook", now, "", "", "", ""].map(x => safeCell(String(x))));
    });
    if(!send.length){ if(out) out.textContent = skipped.length ? `Nothing to send: all ${skipped.length} already on the list.` : "Nothing to send."; return; }
    await mcp.callTool(SERVER, "append_values", {spreadsheetId: GROCERY_ID, range:"List!A1:L", values: send}, {cache:false});
    const after = payloadOf(await mcp.callTool(SERVER, "get_values", {spreadsheetId: GROCERY_ID, range:"List!A1:L"}, {cache:false}));
    const ids = new Set(((after && after.values) || []).map(r => r[0]));
    const landed = send.filter(r => ids.has(r[0])).length;
    const msg = landed === send.length ? `Sent ${landed} item${landed===1?"":"s"} to the grocery list.` : `Sent ${send.length}, but only ${landed} came back on read-back. Check the Groceries list.`;
    if(out) out.textContent = msg + (skipped.length ? ` Skipped ${skipped.length} already there.` : "");
    toast(msg);
  }catch(e){
    if(out) out.textContent = errText(e);
    toast("Couldn't send: " + errText(e));
  } finally { sending = false; const b = $app.querySelector("[data-send-grocery]"); if(b){ b.disabled = false; b.textContent = "Send unchecked items to the grocery list"; } }
}

    <form class="card" id="logform" novalidate>
      <h2>Log a cook</h2>
      <label class="f" for="lg-recipe">Recipe</label><select id="lg-recipe">${D.recipes.map(x => `<option value="${esc(x.id)}" ${r&&x.id===r.id?"selected":""}>${esc(x.name)} (v${esc(x.version)})</option>`).join("")}</select>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label class="f" for="lg-date">Date</label><input id="lg-date" type="date" value="${esc(draft.date||todayISO())}"></div>
        <div><label class="f" for="lg-n">Cook #</label><input id="lg-n" type="text" value="${esc(draft.n||String(prior+1))}"></div></div>
      <label class="f" for="lg-changed">What I changed from last time</label><textarea id="lg-changed">${esc(draft.changed||"")}</textarea>
      <label class="f" for="lg-happened">What happened (taste, texture, timing)</label><textarea id="lg-happened">${esc(draft.happened||"")}</textarea>
      <label class="f" for="lg-her">Her reaction</label><textarea id="lg-her">${esc(draft.her||"")}</textarea>
      <label class="f">My score</label><div class="scores" id="lg-score">${[1,2,3,4,5].map(s => `<button type="button" data-score="${s}" aria-pressed="${String(draft.score)===String(s)}">${s}</button>`).join("")}</div>
      <label class="f" for="lg-next">Next time try</label><textarea id="lg-next">${esc(draft.next||"")}</textarea>
      <div style="margin-top:14px"><button class="btn wide" id="lg-save" type="submit">Save to the log</button></div>
    </form>
    <div class="card"><h2 style="margin-bottom:4px">Past cooks</h2>${list || `<p class="empty">No cooks logged yet.</p>`}</div></div>`;
  wireTop();
  const f = $app.querySelector("#logform");
  const val = () => ({recipe:f.querySelector("#lg-recipe").value, date:f.querySelector("#lg-date").value, n:f.querySelector("#lg-n").value.trim(),
    changed:f.querySelector("#lg-changed").value.trim(), happened:f.querySelector("#lg-happened").value.trim(), her:f.querySelector("#lg-her").value.trim(),
    score:(f.querySelector('[data-score][aria-pressed="true"]')||{}).dataset?.score||"", next:f.querySelector("#lg-next").value.trim()});
  f.addEventListener("input", () => store.set("draft", val()));
  f.querySelector("#lg-recipe").onchange = e => { store.set("logRecipe", e.target.value); store.set("draft", {...val(), n:""}); viewLog(); };
  f.querySelectorAll("[data-score]").forEach(b => b.onclick = () => { f.querySelectorAll("[data-score]").forEach(x => x.setAttribute("aria-pressed", String(x===b && x.getAttribute("aria-pressed")!=="true"))); store.set("draft", val()); });
  f.onsubmit = e => { e.preventDefault(); saveCook(val()); };
}
const safeCell = s => /^[=+\-@]/.test(s) ? "'" + s : s;
async function saveCook(v){
  if(saving) return;
  if(!v.happened && !v.changed && !v.her && !v.next){ toast("Write at least what happened before saving."); return; }
  const r = D.recipes.find(x => x.id === v.recipe);
  const row = [v.date || todayISO(), r ? `${r.name} v${r.version}` : v.recipe, v.n, v.changed, v.happened, v.her, v.score, v.next, v.recipe].map(x => safeCell(String(x)));
  saving = true; const btn = $app.querySelector("#lg-save"); if(btn){ btn.disabled = true; btn.textContent = "Saving…"; }
  try{
    const res = await mcp.callTool(SERVER, "append_values", {spreadsheetId: SHEET_ID, range:"Cooks!A:I", values:[row]}, {cache:false});
    const p = payloadOf(res);
    const after = await read(TABS.Cooks.range);
    const rows = (after && after.values) || [];
    const ok = rows.some(x => x[0]===row[0] && x[4]===row[4] && x[8]===row[8]);
    store.set("draft", {});
    await loadAll(); viewLog();
    toast(ok ? "Saved to your cook log." : "Saved, but the read-back didn't find the row. Check the Cooks tab.");
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = "Save to the log"; }
    showBanner(errText(e) + " Your entry is kept on this device as a draft. If Google Sheets timed out, check the Cooks tab before saving again.");
  } finally { saving = false; }
}

function viewLearn(){
  const focus = store.get("focusTerm", ""); store.set("focusTerm", "");
  const kinds = [...new Set(D.glossary.map(g => g.kind))];
  const gl = kinds.map(k => `<div class="card"><h3 style="margin-bottom:6px">${esc(k)}</h3>${D.glossary.filter(g => g.kind===k).map(g =>
    `<div class="gl" id="t-${esc(g.term.replace(/[^a-z0-9]+/gi,"-").toLowerCase())}" data-gl="${esc(g.term)}"><b>${esc(g.term)}</b> ${g.ja?`<span class="jp muted">${esc(g.ja)}</span>`:""}<div>${esc(g.meaning)}</div></div>`).join("")}</div>`).join("");
  const conv = [["1 tsp (小さじ)","5 ml"],["1 Tbsp (大さじ)","15 ml = 3 tsp"],["1 Japanese cup","200 ml"],["1 US cup","about 240 ml"],["1 oz","28.35 g"],["100 g","about 3.5 oz"],["1 lb","454 g"],["1 inch","2.54 cm"],["1 cm","about 3/8 inch"],["2 to 3 mm","about 1/8 inch"]];
  $app.innerHTML = `<div class="view">${topbar("Learn", "Cuts, techniques and measures used in your recipes.")}
    <div class="card"><h3 style="margin-bottom:6px">Conversions</h3><table class="conv">${conv.map(c => `<tr><td>${esc(c[0])}</td><td>${esc(c[1])}</td></tr>`).join("")}</table></div>
    ${gl}<p class="small muted">Ingredient notes (what each one is and why it's there) open when you tap an ingredient in a recipe.</p></div>`;
  wireTop();
  if(focus){ const el = document.getElementById("t-" + focus.replace(/[^a-z0-9]+/gi,"-").toLowerCase()); if(el){ el.scrollIntoView({block:"center"}); el.style.background = "var(--nori-soft)"; } }
}

/* ---------- chrome ---------- */
let toastT;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
function showBanner(msg, action, fn){ const b = document.getElementById("banner"); b.innerHTML = `<div>${esc(msg)}</div>${action?`<button class="btn" data-banner>${esc(action)}</button>`:""}`; b.hidden = false; if(action) b.querySelector("[data-banner]").onclick = fn; }
function hideBanner(){ document.getElementById("banner").hidden = true; }

window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && syncedAt && Date.now() - syncedAt > 60000) refresh(); });

(async function start(){
  const c = store.get("cache", null);
  if(c){ D = shape(c.raw); syncedAt = new Date(c.at); render(); }
  mcp = (window.claude && window.claude.use) ? await window.claude.use("mcp") : null;
  if(!mcp){
    if(!D) $app.innerHTML = `<header class="top"><h1>Teppan Notebook</h1></header><p>Open this page in the Claude app or on claude.ai while signed in. It reads your recipes and saves your cook log through your Google Sheets connection.</p>`;
    else showBanner("Offline: showing the copy saved on this device. Logging a cook needs Google Sheets.");
    return;
  }
  await loadAll(); render();
})();
</script>
