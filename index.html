/* Teppan Cookbook version 0.7.1 (CS-066, 2026-11-12: a list read in flight no longer hides a just-added item; Loading text; favicon). 0.7 (2026-11-11): standalone app on Netlify; data through the Apps Script endpoint (no Claude or Google sign-in); new List tab, the shared grocery list. Built from Teppan Notebook version 3 by build.py. */
/* Notebook version 3 (CS-066, 2026-11-05): Shop sends unchecked items to the shared Grocery list sheet; Cook # suggests max cook number + 1 (ISS-071). */
/* Version 2 (CS-063, 2026-11-01): amounts shown under each step, scaled; totals in the ingredient's own unit. */

}

  --nori:#7CC489; --nori-soft:#21362A; --beni:#F0778A; --beni-soft:#3B2228; --sauce:#D6A57D; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1B212B; --sunk:#232A35; --ink:#E7EAEE; --muted:#9AA3AF; --line:#2E3643;
  --nori:#7CC489; --nori-soft:#21362A; --beni:#F0778A; --beni-soft:#3B2228; --sauce:#D6A57D; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}

/* log */
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}

.scores button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:10px 0;font-weight:600}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}

nav.tabs a .k{font-family:var(--jp);font-size:17px;font-weight:500;line-height:1.1}
nav.tabs a[aria-current="page"]{color:var(--nori);background:var(--nori-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-weight:500;max-width:92vw;z-index:10}

@media (prefers-reduced-motion:no-preference){.view{animation:in .16s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyeotDjY0A35x3v0Gs14w8qA4brvaMrDvcgkvmDT4q56ixK0U34jlklVGM-ctyhn99lvg/exec"; // Apps Script web app bound to the Grocery list Sheet (Spine/Cooking)
const PEOPLE = ["John", "Courtney"];
const TABS = {
  Recipes:     {range:"Recipes!A1:M200",     head:["ID","Name","Japanese","Version","Unit","Unit plural","Default servings","Style","Why it works","Source","Equipment","What changed in this version","Status"]},
  Ingredients: {range:"Ingredients!A1:K1000", head:["Recipe","Order","Group","Item","Look for","Per serving","Unit","Prep","Pantry ID","Why (detail)","Note"]},
  Steps:       {range:"Steps!A1:H1000",       head:["Recipe","Phase","Order","Step","Detail","Timer (min)","Glossary","Ingredients"]},
  Pantry:      {range:"Pantry!A1:L500",       head:["#","Item","Look for (Japanese)",null,"Where in Nijiya",null,"Notes","Recipes","Pantry ID","Section","Buy by","Keep"]},
  Glossary:    {range:"Glossary!A1:D500",     head:["Term","Japanese","Kind","Meaning"]},
  Cooks:       {range:"Cooks!A1:I5000",       head:["Date","Recipe","Cook #",null,null,"Her reaction",null,"Next time try","Recipe ID"]}
};
const SECTION_ORDER = ["Produce","Meat","Refrigerated and pickles","Dry goods","Sauces and seasonings","Home staples"];
const PER_BOWL = new Set(["Fillings","On top while cooking","Finish","Griddle"]);
const CABBAGE_HEAD_G = 900; // owner, cook 1: 300 g is about 1/3 of a head

let D = null, L = null, syncedAt = null, saving = false;
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("teppan:"+k); return v==null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("teppan:"+k, JSON.stringify(v)); }catch{} }
};

/* ---------- amounts ---------- */
const FR = [[0,""],[0.125,"⅛"],[0.25,"¼"],[1/3,"⅓"],[0.5,"½"],[2/3,"⅔"],[0.75,"¾"],[1,""]];
function frac(x){
  let w = Math.floor(x), r = x - w, best = FR[0], bd = 9;
  for(const f of FR){ const d = Math.abs(r - f[0]); if(d < bd){ bd = d; best = f; } }
  if(best[0] === 1){ w += 1; best = FR[0]; }
  const approx = w + best[0];
  const txt = (w ? String(w) : "") + (best[1] ? (w ? " " : "") + best[1] : "");
  return {txt: txt || "0", approx};
}
function roundTo(x, step){ return Math.round(x / step) * step; }
function headTxt(grams){
  const x = grams / CABBAGE_HEAD_G, opts = [[1/6,"⅙"],[0.25,"¼"],[1/3,"⅓"],[0.5,"½"],[2/3,"⅔"],[0.75,"¾"],[5/6,"⅚"],[1,"1"]];
  const w = Math.floor(x), r = x - w; let best = ["", ""], bd = 9;
  for(const o of [[0,""], ...opts]){ const d = Math.abs(r - o[0]); if(d < bd){ bd = d; best = o; } }
  if(best[1] === "1") return String(w + 1);
  return (w ? w + (best[1] ? " " : "") : "") + best[1] || "0";
}
/* Steps column H: Order numbers of the ingredients a step uses; "total:" prefix shows totals only for that step */
function parseIngs(str){
  let s = String(str || "").trim(), total = false;
  if(/^total:/i.test(s)){ total = true; s = s.replace(/^total:/i, ""); }
  return {total, orders: s.split(",").map(t => parseInt(t.trim(), 10)).filter(Number.isFinite)};
}
function stepAmt(x, n, us, forceTotal, unitName){
  const scant = /scant/i.test(x.note);
  const tot = fmtAmount(x.per == null ? null : x.per * n, x.unit, scant);
  const one = fmtAmount(x.per, x.unit, scant);
  const each = PER_BOWL.has(x.group) && !forceTotal;
  const main = x.per == null ? tot.main : (each && n > 1 ? `${one.main} per ${unitName}` : tot.main);
  const sub = [];
  if(each && n > 1 && x.per != null) sub.push(`${tot.main} total`);
  if(x.pantry === "P16" && x.per != null) sub.push(`about ${headTxt(x.per * n)} head`);
  if(us && tot.us && x.per != null) sub.push(tot.us);
  return {main, sub: sub.join(" · ")};
}
function fmtAmount(qty, unit, scantFlag){
  if(qty == null || isNaN(qty) || unit === "") return {main:"to taste", us:""};
  let main, us = "";
  if(unit === "g"){
    const v = qty >= 50 ? roundTo(qty, 5) : Math.round(qty);
    main = v + " g";
    const oz = qty / 28.35; us = oz >= 16 ? (qty/453.6).toFixed(2).replace(/0$/,"") + " lb" : (oz < 1 ? oz.toFixed(2) : oz.toFixed(1)) + " oz";
  } else if(unit === "ml"){
    const v = qty >= 50 ? roundTo(qty, 5) : Math.round(qty);
    main = v + " ml";
    const c = frac(qty / 240); us = (c.txt === "0" ? (qty/29.57).toFixed(1) + " fl oz" : c.txt + " cup");
  } else if(unit === "tsp"){
    const f = frac(qty); main = f.txt + " tsp"; us = Math.round(qty * 5 * 10) / 10 + " ml";
  } else if(unit === "Tbsp"){
    const f = frac(qty); main = f.txt + " Tbsp"; us = Math.round(qty * 15) + " ml";
  } else if(unit === "egg"){
    const f = frac(qty); main = f.txt + (qty === 1 ? " egg" : " eggs");
  } else if(unit === "leaf"){
    const f = frac(qty); main = f.txt + (qty === 1 ? " leaf" : " leaves");
  } else { const f = frac(qty); main = f.txt + " " + unit; }
  if(scantFlag) main = "scant " + main;
  return {main, us};
}

/* ---------- endpoint (CS-066) ---------- */
async function api(p, ms){
  if(!API_URL || /PASTE/.test(API_URL)) throw {offline:false, message:"The app isn't connected to its endpoint yet."};
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 25000);
  let res;
  try{
    res = await fetch(API_URL, {method:"POST", body: JSON.stringify(p), headers:{"Content-Type":"text/plain;charset=utf-8"}, redirect:"follow", signal: ctl.signal});
  }catch(e){ throw {offline:true, message: navigator.onLine === false ? "No signal." : "Couldn't reach the list. Check your signal."}; }
  finally{ clearTimeout(t); }
  let j = null;
  try{ j = await res.json(); }catch{ throw {offline:true, message:"The list answered with something unexpected (" + res.status + ")."}; }
  if(!j || !j.ok) throw {offline:false, message: (j && j.error) || "The list reported a problem."};
  return j;
}
function errText(e){ return (e && e.message) ? e.message : "Something went wrong."; }

/* ---------- who's on this phone ---------- */
let meMem = null;
function me(){ return store.get("me", null) || meMem; }
function setMe(n){ meMem = n; store.set("me", n); }
function askMe(then){
  $app.innerHTML = `<div class="view"><header class="top"><h1>Teppan Cookbook</h1></header>
    <div class="card"><h2>Who's using this phone?</h2><p class="muted">Your name goes on what you add and tick, so the other person can see who did it.</p>
    <div class="row-wrap">${PEOPLE.map(n => `<button class="btn" data-me="${esc(n)}">${esc(n)}</button>`).join("")}</div></div></div>`;
  $app.querySelectorAll("[data-me]").forEach(b => b.onclick = () => { setMe(b.dataset.me); then(); });
}

/* ---------- shared grocery list: optimistic, queued, works offline ---------- */
let Q = null;            // pending changes, oldest first; kept in memory, mirrored to storage
let flushing = false, listAt = null;
let listGen = 0;        // bumped on every local change and every saved change; a list read that started before a bump is stale and is dropped
function qLoad(){ if(Q === null) Q = store.get("queue", []) || []; return Q; }
function qSave(){ store.set("queue", Q); }
function pending(){ return qLoad().length; }
function tmpId(){ return "tmp-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function norm(s){ return String(s || "").trim().toLowerCase(); }
function openOnList(name){ return (L ? L.list : []).find(x => !x.Done && !x.Cleared && norm(x.Item) === norm(name)); }
function stamp(){ return new Date().toISOString(); }

// Apply one change to the local list (used when queued, and again after a refresh while changes are still waiting).
function applyLocal(op){
  if(!L) return;
  if(op.op === "add"){
    op.items.forEach(it => { if(openOnList(it.item)) return; L.list.push({ID: it.tmp, Item: it.item, Qty: it.qty || "", Section: sectionFor(it.section), Store: it.store || "", Note: it.note || "", "Added by": op.by, Added: op.at, Done:"", "Done by":"", "Done at":"", Cleared:""}); });
  } else if(op.op === "tick"){
    const x = L.list.find(y => y.ID === op.id); if(x){ x.Done = op.done ? "yes" : ""; x["Done by"] = op.done ? op.by : ""; x["Done at"] = op.done ? op.at : ""; }
  } else if(op.op === "remove"){
    L.list = L.list.filter(y => y.ID !== op.id);
  } else if(op.op === "clear"){
    L.list = L.list.filter(y => !y.Done);
  } else if(op.op === "usual"){
    const i = L.usual.findIndex(u => norm(u.Item) === norm(op.item));
    if(op.star){ const u = {ID: i >= 0 ? L.usual[i].ID : op.tmp, Item: op.item, Qty: op.qty || "", Section: sectionFor(op.section), Store: op.store || ""}; if(i >= 0) L.usual[i] = u; else L.usual.push(u); }
    else if(i >= 0) L.usual.splice(i, 1);
  }
}
function enqueue(op){
  op.at = stamp(); op.by = me() || "";
  qLoad().push(op); qSave(); listGen++;
  applyLocal(op); cacheList();
  flush();
}
function sectionFor(name){
  const n = norm(name); if(!n || !L) return name || "";
  for(const s of L.sections){
    if(norm(s.Section) === n) return s.Section;
    if(String(s.Aliases || "").split(",").map(norm).filter(Boolean).includes(n)) return s.Section;
  }
  return name;
}
function cacheList(){ if(L) store.set("list", {L, at: listAt ? listAt.toISOString() : null}); }

async function flush(){
  if(flushing || !pending()) { updateListStatus(); return; }
  flushing = true; updateListStatus();
  try{
    while(qLoad().length){
      const op = Q[0];
      let res;
      try{
        if(op.op === "add") res = await api({action:"add", by: op.by, items: op.items});
        else if(op.op === "tick") res = await api({action:"tick", id: op.id, done: op.done, by: op.by});
        else if(op.op === "remove") res = await api({action:"remove", id: op.id});
        else if(op.op === "clear") res = await api({action:"clear"});
        else if(op.op === "usual") res = await api({action:"usual", item: op.item, qty: op.qty, section: op.section, store: op.store, star: op.star});
      }catch(e){
        if(e && e.offline) break;                        // keep it; try again when the signal is back
        toast("Couldn't save a change: " + errText(e));    // the server refused it: drop it so the rest can go
      }
      Q.shift(); listGen++;
      if(op.op === "add" && res && res.map){             // swap temporary ids for the real ones everywhere
        Object.entries(res.map).forEach(([t, id]) => {
          Q.forEach(o => { if(o.id === t) o.id = id; });
          if(L) L.list.forEach(x => { if(x.ID === t) x.ID = id; });
        });
      }
      qSave();
    }
  } finally {
    flushing = false;
    if(!pending()) await refreshList(true);
    updateListStatus();
  }
}
async function refreshList(quiet){
  if(pending() || flushing) return;
  const gen = listGen;
  try{
    const s = await api({action:"state"}, 20000);
    if(gen !== listGen || pending() || flushing) return;   // a change happened while this read was in flight
    L = {list: s.list, usual: s.usual, sections: s.sections}; listAt = new Date(); cacheList();
    if(route() === "list") viewList();
  }catch(e){ if(!quiet) toast(errText(e)); updateListStatus(); }
}
function updateListStatus(){
  const el = document.querySelector("[data-liststatus]"); if(!el) return;
  const n = pending();
  const t = listAt ? listAt.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"}) : "not yet";
  el.textContent = n ? `${n} change${n===1?"":"s"} waiting to save${flushing ? "…" : " (no signal?)"}` : `Synced ${t}`;
  el.dataset.pending = String(n);
}

// Best guess at a section for a typed item: same name on the list before, a usual, or a Pantry item.
function guessSection(name){
  const n = norm(name); if(!n) return "";
  const hit = (L ? [...L.list, ...L.usual] : []).find(x => norm(x.Item) === n && x.Section);
  if(hit) return hit.Section;
  const p = D && D.pantry.find(x => norm(x.item) === n);
  return p ? sectionFor(p.section) : "";
}

function checkHead(name, row){
  const want = TABS[name].head;
  for(let i = 0; i < want.length; i++){
    if(want[i] && String(row[i] || "").trim() !== want[i]) return `${name} column ${String.fromCharCode(65+i)} should be "${want[i]}" but reads "${row[i] || ""}".`;
  }
  return null;
}
function shape(raw){
  const rows = n => (raw[n] || []).slice(1).filter(r => r.some(c => String(c).trim() !== ""));
  const g = (r, i) => (r[i] ?? "").toString().trim();
  const recipes = rows("Recipes").map(r => ({id:g(r,0), name:g(r,1), ja:g(r,2), version:g(r,3), unit:g(r,4)||"serving", units:g(r,5)||"servings",
    def:Math.max(1, parseInt(g(r,6)) || 2), style:g(r,7), why:g(r,8), source:g(r,9), equip:g(r,10).split("\n").filter(Boolean), changed:g(r,11), status:g(r,12)})).filter(x => x.id);
  const ingredients = rows("Ingredients").map(r => ({recipe:g(r,0), order:+g(r,1)||0, group:g(r,2), item:g(r,3), look:g(r,4), per:g(r,5)===""?null:Number(g(r,5)),
    unit:g(r,6), prep:g(r,7), pantry:g(r,8), why:g(r,9), note:g(r,10)})).sort((a,b)=>a.order-b.order);
  const steps = rows("Steps").map(r => ({recipe:g(r,0), phase:g(r,1), order:+g(r,2)||0, step:g(r,3), detail:g(r,4), timer:parseFloat(g(r,5))||0, term:g(r,6), ings:g(r,7)}));
  const pantry = rows("Pantry").map(r => ({n:g(r,0), item:g(r,1), look:g(r,2), bought:g(r,3), where:g(r,4), price:g(r,5), notes:g(r,6), id:g(r,8), section:g(r,9)||"Other", buy:g(r,10)||"stock", keep:g(r,11)})).filter(x => x.id);
  const glossary = rows("Glossary").map(r => ({term:g(r,0), ja:g(r,1), kind:g(r,2)||"Other", meaning:g(r,3)}));
  const cooks = rows("Cooks").map((r,i) => ({row:i+2, date:g(r,0), recipeName:g(r,1), n:g(r,2), changed:g(r,3), happened:g(r,4), her:g(r,5), score:g(r,6), next:g(r,7), recipe:g(r,8)}));
  return {recipes, ingredients, steps, pantry, glossary, cooks};
}
async function loadAll(){
  const gen = listGen;
  try{
    const s = await api({action:"state", recipes:true});
    const problems = Object.keys(TABS).map(n => checkHead(n, (s.raw[n] || [])[0] || [])).filter(Boolean);
    if(problems.length) throw {message: problems.join(" ")};
    D = shape(s.raw); syncedAt = new Date(); store.set("cache", {raw: s.raw, at: syncedAt.toISOString()});
    if(gen === listGen && !pending() && !flushing){ L = {list: s.list, usual: s.usual, sections: s.sections}; listAt = new Date(); cacheList(); }

    const c = store.get("cache", null);
    if(!D && c){ D = shape(c.raw); syncedAt = new Date(c.at); }
    showBanner(errText(e) + (D ? " Showing the copy saved on this phone." : ""), "Refresh", refresh);
  }
}

      <div class="sec-body"><ul class="plain">${r.equip.map(e => `<li>${esc(e)}</li>`).join("")}</ul></div></details>
    <details class="sec" ${store.get("open:"+id+"Ing", false)?"open":""} data-sec="Ing"><summary><h2>Ingredients</h2><span class="cnt">${ings.length}</span></summary><div class="sec-body"><p class="small muted" style="margin:0 0 6px">Reference list. Each amount also sits under the step that uses it.</p>${grpHtml}</div></details>
    ${phase("Prep")}${phase("Cook")}${phase("Finish")}
    <details class="sec" data-sec="Why"><summary><h2>Why it works</h2><span class="cnt"></span></summary><div class="sec-body">
      <p><b>Style.</b> ${esc(r.style)}</p><p>${esc(r.why)}</p><p><b>This version.</b> ${esc(r.changed)}</p><p class="small muted"><b>Source.</b> ${esc(r.source)}</p></div></details>
    <button class="btn wide" data-logcook>Log this cook</button>
    <p class="small muted" style="text-align:center"><button class="iconbtn" data-reset>Clear ticks</button></p>
  </div>`;
  $app.querySelector("[data-back]").onclick = () => { location.hash = "recipes"; };
  $app.querySelectorAll("[data-serv]").forEach(b => b.onclick = () => { store.set("serv:"+id, Math.max(1, Math.min(20, n + (+b.dataset.serv)))); viewRecipe(id); });
  $app.querySelectorAll("[data-us]").forEach(b => b.onclick = () => { store.set("us", b.dataset.us === "1"); viewRecipe(id); });
  $app.querySelectorAll("[data-ing],[data-stxt]").forEach(b => b.onclick = () => {
    const box = b.closest(".ing, li").querySelector(".more"); box.hidden = !box.hidden; b.setAttribute("aria-expanded", String(!box.hidden)); });
  $app.querySelectorAll("[data-tick]").forEach(b => b.onclick = () => { const d = store.get("done:"+id, {}); d[b.dataset.tick] = !d[b.dataset.tick]; store.set("done:"+id, d); viewRecipe(id); });
  $app.querySelectorAll("details.sec").forEach(d => d.addEventListener("toggle", () => store.set("open:"+id+d.dataset.sec, d.open)));
  $app.querySelectorAll("[data-timer]").forEach(b => b.onclick = () => startTimer(b));
  $app.querySelectorAll("[data-term]").forEach(a => a.onclick = () => store.set("focusTerm", a.dataset.term));
  $app.querySelector("[data-reset]").onclick = () => { store.set("done:"+id, {}); viewRecipe(id); };
  $app.querySelector("[data-logcook]").onclick = () => { store.set("logRecipe", id); location.hash = "log"; };
  restoreTimers();
}

/* timers: per viewer, survive re-render */
const timers = {};
function fmtClock(s){ s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function startTimer(b){
  const k = b.dataset.tk;
  if(timers[k]){ clearInterval(timers[k].iv); delete timers[k]; b.className = "timer"; b.textContent = "Timer " + fmtClock(+b.dataset.timer*60); return; }
  timers[k] = {end: Date.now() + (+b.dataset.timer)*60000, iv: null};
  tick(k); timers[k].iv = setInterval(() => tick(k), 500);
}
function tick(k){
  const t = timers[k]; if(!t) return;
  const b = $app.querySelector(`[data-tk="${CSS.escape(k)}"]`);
  const left = (t.end - Date.now())/1000;
  if(left <= 0){ clearInterval(t.iv); t.done = true; if(b){ b.className = "timer end"; b.textContent = "Time's up · tap to reset"; } if(!t.beeped){ t.beeped = true; beep(); } return; }
  if(b){ b.className = "timer run"; b.textContent = fmtClock(left) + " left · tap to stop"; }
}
function restoreTimers(){ Object.keys(timers).forEach(k => { if(timers[k].done){ const b = $app.querySelector(`[data-tk="${CSS.escape(k)}"]`); if(b){ b.className="timer end"; b.textContent="Time's up · tap to reset"; } } else tick(k); }); }
function beep(){ try{ const c = new (window.AudioContext||window.webkitAudioContext)(); [0,0.35,0.7].forEach(t => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+0.2); }); }catch{} if(navigator.vibrate) try{ navigator.vibrate([200,100,200]); }catch{} }

function viewShop(){
  const plan = store.get("plan", null) || Object.fromEntries(D.recipes.map(r => [r.id, r.def]));
  const got = store.get("got", {});
  const need = {};
  D.recipes.forEach(r => {
    const n = plan[r.id] || 0; if(!n) return;
    D.ingredients.filter(x => x.recipe === r.id).forEach(x => {
      const p = D.pantry.find(q => q.id === x.pantry); if(!p) return;
      const e = need[p.id] || (need[p.id] = {p, qty:{}, recipes:new Set()});
      e.recipes.add(r.name);
      if(x.per != null && x.unit){ e.qty[x.unit] = (e.qty[x.unit] || 0) + x.per * n; }
    });
  });
  const secs = [...new Set([...SECTION_ORDER, ...Object.values(need).map(e => e.p.section)])];
  const list = secs.map(s => {
    const items = Object.values(need).filter(e => e.p.section === s).sort((a,b) => (+a.p.n||99) - (+b.p.n||99));
    if(!items.length) return "";
    return `<div class="card sh-sec" data-section="${esc(s)}"><h3 style="margin-bottom:6px">${esc(s)}</h3>${items.map(e => {
      const p = e.p, isAmt = p.buy === "amount";
      let amt = "have it?";
      if(isAmt){
        amt = Object.entries(e.qty).map(([u,q]) => fmtAmount(q,u).main).join(" + ");
        if(p.id === "P16" && e.qty.g) amt += ` · about ${frac(e.qty.g / CABBAGE_HEAD_G).txt} head`;
      }
      return `<label class="item ${got[p.id]?"got":""}" data-item="${esc(p.id)}"><input type="checkbox" data-got="${esc(p.id)}" ${got[p.id]?"checked":""}>
        <span><span class="iname">${esc(p.item)}</span> ${p.look?`<span class="jp small muted">${esc(p.look)}</span>`:""}
        <div class="where">${esc(p.where)}${p.bought?` · last time: ${esc(p.bought)}`:""}</div>${p.notes?`<div class="where">${esc(p.notes)}</div>`:""}</span>
        <span class="amt" data-need="${esc(p.id)}">${esc(amt)}${p.price?`<small>${esc(p.price)}</small>`:""}</span></label>`;
    }).join("")}</div>`;
  }).join("");
  const rq = D.recipes.map(r => `<div class="rq"><span>${esc(r.name)}</span><div class="stepper">
      <button data-plan="${esc(r.id)}" data-d="-1" aria-label="Fewer ${esc(r.units)}">−</button><output data-plan-out="${esc(r.id)}">${plan[r.id]||0} ${esc((plan[r.id]||0)===1?r.unit:r.units)}</output><button data-plan="${esc(r.id)}" data-d="1" aria-label="More ${esc(r.units)}">+</button></div></div>`).join("");
  $app.innerHTML = `<div class="view">${topbar("Shopping list", "Pick recipes and amounts; the list builds itself.")}
    <div class="card">${rq}</div>
    ${list || `<p class="empty">Add a recipe above to build the list.</p>`}
    ${list ? `<div class="card"><button class="btn wide" data-send-grocery ${sending?"disabled":""}>${sending?"Sending…":"Send unchecked items to the List"}</button><p class="small muted" style="margin:8px 0 0">Puts what isn't ticked here on the shared List. Items already on it are skipped.</p><div class="small" data-send-result></div></div>` : ""}
    ${list ? `<p style="text-align:center"><button class="iconbtn" data-clear>Uncheck everything</button></p>` : ""}</div>`;
  wireTop();
  const sg = $app.querySelector("[data-send-grocery]"); if(sg) sg.onclick = () => sendToGrocery(need, store.get("got", {}));  // read ticks fresh: the render-time copy goes stale
  $app.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => { const p = {...plan}; p[b.dataset.plan] = Math.max(0, Math.min(20, (p[b.dataset.plan]||0) + (+b.dataset.d))); store.set("plan", p); viewShop(); });
  $app.querySelectorAll("[data-got]").forEach(c => c.onchange = () => { const g = store.get("got", {}); g[c.dataset.got] = c.checked; store.set("got", g); c.closest(".item").classList.toggle("got", c.checked); });
  const cl = $app.querySelector("[data-clear]"); if(cl) cl.onclick = () => { store.set("got", {}); viewShop(); };
}

/* Push to the shared grocery list (CS-066): queued like any List change, so it works with no signal. */
let sending = false;
function sendToGrocery(need, got){
  if(sending) return; sending = true;
  try{
    const items = Object.values(need).filter(e => !got[e.p.id]);
    const skipped = [], send = [];
    items.forEach(e => {
      const p = e.p;
      if(openOnList(p.item)){ skipped.push(p.item); return; }
      const isAmt = p.buy === "amount";
      let qty = isAmt ? Object.entries(e.qty).map(([u,q]) => fmtAmount(q,u).main).join(" + ") : "";
      if(isAmt && p.id === "P16" && e.qty.g) qty += ` (about ${frac(e.qty.g / CABBAGE_HEAD_G).txt} head)`;
      const store_ = /any grocery/i.test(p.where) ? "" : "Nijiya";
      const note = [isAmt ? "" : "stock item: check what's left", p.look, p.where, "for " + [...e.recipes].join(", ")].filter(Boolean).join(" · ");
      send.push({item:p.item, qty, section:p.section, store:store_, note, tmp: tmpId()});
    });
    const out = $app.querySelector("[data-send-result]");
    if(!send.length){ const m = skipped.length ? `Nothing to send: all ${skipped.length} already on the List.` : "Nothing to send."; if(out) out.textContent = m; toast(m); return; }
    enqueue({op:"add", items: send});
    const m = `Put ${send.length} item${send.length===1?"":"s"} on the List.` + (skipped.length ? ` Skipped ${skipped.length} already there.` : "");
    if(out) out.textContent = m; toast(m);
  } finally { sending = false; }
}

function todayISO(){ const d = new Date(), p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function viewLog(){
  const pick = store.get("logRecipe", D.recipes[0] && D.recipes[0].id);
  const draft = store.get("draft", {});
  const r = D.recipes.find(x => x.id === pick) || D.recipes[0];
  const prior = D.cooks.filter(c => r && c.recipe === r.id).reduce((m, c) => Math.max(m, parseInt(String(c.n), 10) || 0), 0); // ISS-071: highest cook number, not row count
  const list = [...D.cooks].reverse().map(c => {
    const rr = D.recipes.find(x => x.id === c.recipe);
    return `<div class="cook" data-cookrow="${c.row}"><div class="row-wrap"><b>${esc(rr ? rr.name : c.recipeName)}</b><span class="chip">cook ${esc(c.n)}</span><span class="muted small">${esc(c.date)}</span>${c.score?`<span class="chip nori">${esc(c.score)}/5</span>`:""}</div>
      <dl>${c.changed?`<dt>Changed</dt><dd>${esc(c.changed)}</dd>`:""}${c.happened?`<dt>Happened</dt><dd>${esc(c.happened)}</dd>`:""}${c.her?`<dt>Her</dt><dd>${esc(c.her)}</dd>`:""}${c.next?`<dt>Next time</dt><dd>${esc(c.next)}</dd>`:""}</dl></div>`;
  }).join("");
  $app.innerHTML = `<div class="view">${topbar("Cook log", "What changed, what happened, how she liked it.")}
    <form class="card" id="logform" novalidate>
      <h2>Log a cook</h2>
      <label class="f" for="lg-recipe">Recipe</label><select id="lg-recipe">${D.recipes.map(x => `<option value="${esc(x.id)}" ${r&&x.id===r.id?"selected":""}>${esc(x.name)} (v${esc(x.version)})</option>`).join("")}</select>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label class="f" for="lg-date">Date</label><input id="lg-date" type="date" value="${esc(draft.date||todayISO())}"></div>
        <div><label class="f" for="lg-n">Cook #</label><input id="lg-n" type="text" value="${esc(draft.n||String(prior+1))}"></div></div>
      <label class="f" for="lg-changed">What I changed from last time</label><textarea id="lg-changed">${esc(draft.changed||"")}</textarea>
      <label class="f" for="lg-happened">What happened (taste, texture, timing)</label><textarea id="lg-happened">${esc(draft.happened||"")}</textarea>
      <label class="f" for="lg-her">Her reaction</label><textarea id="lg-her">${esc(draft.her||"")}</textarea>
      <label class="f">My score</label><div class="scores" id="lg-score">${[1,2,3,4,5].map(s => `<button type="button" data-score="${s}" aria-pressed="${String(draft.score)===String(s)}">${s}</button>`).join("")}</div>
      <label class="f" for="lg-next">Next time try</label><textarea id="lg-next">${esc(draft.next||"")}</textarea>
      <div style="margin-top:14px"><button class="btn wide" id="lg-save" type="submit">Save to the log</button></div>
    </form>
    <div class="card"><h2 style="margin-bottom:4px">Past cooks</h2>${list || `<p class="empty">No cooks logged yet.</p>`}</div></div>`;
  wireTop();
  const f = $app.querySelector("#logform");
  const val = () => ({recipe:f.querySelector("#lg-recipe").value, date:f.querySelector("#lg-date").value, n:f.querySelector("#lg-n").value.trim(),
    changed:f.querySelector("#lg-changed").value.trim(), happened:f.querySelector("#lg-happened").value.trim(), her:f.querySelector("#lg-her").value.trim(),
    score:(f.querySelector('[data-score][aria-pressed="true"]')||{}).dataset?.score||"", next:f.querySelector("#lg-next").value.trim()});
  f.addEventListener("input", () => store.set("draft", val()));
  f.querySelector("#lg-recipe").onchange = e => { store.set("logRecipe", e.target.value); store.set("draft", {...val(), n:""}); viewLog(); };
  f.querySelectorAll("[data-score]").forEach(b => b.onclick = () => { f.querySelectorAll("[data-score]").forEach(x => x.setAttribute("aria-pressed", String(x===b && x.getAttribute("aria-pressed")!=="true"))); store.set("draft", val()); });
  f.onsubmit = e => { e.preventDefault(); saveCook(val()); };
}
const safeCell = s => /^[=+\-@]/.test(s) ? "'" + s : s;
async function saveCook(v){
  if(saving) return;
  if(!v.happened && !v.changed && !v.her && !v.next){ toast("Write at least what happened before saving."); return; }
  const r = D.recipes.find(x => x.id === v.recipe);
  const row = [v.date || todayISO(), r ? `${r.name} v${r.version}` : v.recipe, v.n, v.changed, v.happened, v.her, v.score, v.next, v.recipe].map(x => safeCell(String(x)));
  saving = true; const btn = $app.querySelector("#lg-save"); if(btn){ btn.disabled = true; btn.textContent = "Saving…"; }
  try{
    await api({action:"log", row});   // the endpoint reads the row back and refuses if it differs
    const ok = true;
    store.set("draft", {});
    await loadAll(); viewLog();
    toast("Saved to the cook log.");
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = "Save to the log"; }
    showBanner(errText(e) + " Your entry is kept on this phone as a draft." + (e && e.offline ? " Save again when there is a signal; if it timed out, check the log before saving twice." : ""));
  } finally { saving = false; }
}

function viewLearn(){

}

/* ---------- chrome ---------- */
let toastT;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
function showBanner(msg, action, fn){ const b = document.getElementById("banner"); b.innerHTML = `<div>${esc(msg)}</div>${action?`<button class="btn" data-banner>${esc(action)}</button>`:""}`; b.hidden = false; if(action) b.querySelector("[data-banner]").onclick = fn; }
function hideBanner(){ document.getElementById("banner").hidden = true; }

window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });
document.addEventListener("visibilitychange", () => { if(document.visibilityState !== "visible") return; if(pending()) flush(); else if(route() === "list") refreshList(true); if(syncedAt && Date.now() - syncedAt > 60000) refresh(); });

(async function start(){
  const c = store.get("cache", null);
  if(c){ D = shape(c.raw); syncedAt = new Date(c.at); }
  const lc = store.get("list", null);
  if(lc && lc.L){ L = lc.L; listAt = lc.at ? new Date(lc.at) : null; qLoad().forEach(applyLocal); }
  if("serviceWorker" in navigator) try{ navigator.serviceWorker.register("sw.js").catch(() => {}); }catch{}
  const go = async () => { render(); await loadAll(); render(); flush(); };
  if(!me()) askMe(go); else go();
})();
